<body>
  <script>
    function reverse(s) {
      return  [...s].reverse().join("");
    }

    console.log(reverse("string"))

    function reverseNum(l1, l2) {

      reversed1 = Number([...l1].reverse().join(""));
      reversed2 = Number([...l2].reverse().join(""));

      const reversedNums = reversed1 + reversed2;

      return String(reversedNums).split('').map(Number);
    }

    console.log(reverseNum([2,4,3],[2,4,3]))
  </script>
</body>
